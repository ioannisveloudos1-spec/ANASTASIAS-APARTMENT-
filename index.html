<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anastasia's Apartment - Φωτογραφίες Καταλύματος</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8f9fa;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        h2 {
            color: #1a365d;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 10px;
            margin-top: 30px;
        }
        .photo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 15px;
            padding: 15px 0;
        }
        .photo-item img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .photo-item img:hover {
            transform: scale(1.02);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        /* Modal Lightbox Overlay */
        #lightbox-modal {
            display: none;
            position: fixed;
            z-index: 9999;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            align-items: center;
            justify-content: center;
        }
        #lightbox-modal img {
            max-width: 90%;
            max-height: 85vh;
            border-radius: 5px;
            box-shadow: 0 0 20px rgba(255,255,255,0.2);
        }
        .lightbox-close {
            position: absolute;
            top: 20px;
            right: 30px;
            color: #fff;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
        }
        .lightbox-prev, .lightbox-next {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            color: #fff;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
            padding: 10px 20px;
            user-select: none;
            background: rgba(0,0,0,0.4);
            border-radius: 4px;
            transition: background 0.2s;
        }
        .lightbox-prev:hover, .lightbox-next:hover {
            background: rgba(255,255,255,0.3);
        }
        .lightbox-prev { left: 20px; }
        .lightbox-next { right: 20px; }
        .lightbox-caption {
            position: absolute;
            bottom: 20px;
            color: #fff;
            font-size: 16px;
        }
    </style>
</head>
<body>

<div class="container">
    <p>Κάντε κλικ σε οποιαδήποτε φωτογραφία για να ανοίξει σε πλήρη προβολή και να την ξεφυλλίσετε:</p>

    <!-- Ενότητα: Κεντρική Είσοδος & Εξωτερικός Χώρος -->
    <h2>Κεντρική Είσοδος & Εξωτερικός Χώρος</h2>
    <div class="photo-grid">
        <div class="photo-item"><img src="images/e3odos1.jpg" alt="Είσοδος 1" class="gallery-img"></div>
        <div class="photo-item"><img src="images/e3odos2.jpg" alt="Είσοδος 2" class="gallery-img"></div>
        <div class="photo-item"><img src="images/e3odos3.jpg" alt="Είσοδος 3" class="gallery-img"></div>
    </div>

    <!-- Ενότητα: Σαλόνι & Hall -->
    <h2>Σαλόνι & Hall</h2>
    <div class="photo-grid">
        <div class="photo-item"><img src="images/saloni1.jpg" alt="Σαλόνι" class="gallery-img"></div>
        <div class="photo-item"><img src="images/hall1.jpg" alt="Hall" class="gallery-img"></div>
    </div>

    <!-- Ενότητα: Κουζίνα -->
    <h2>Κουζίνα</h2>
    <div class="photo-grid">
        <div class="photo-item"><img src="images/kouzina1.jpg" alt="Κουζίνα 1" class="gallery-img"></div>
        <div class="photo-item"><img src="images/kouzina2.jpg" alt="Κουζίνα 2" class="gallery-img"></div>
        <div class="photo-item"><img src="images/kouzina3.jpg" alt="Κουζίνα 3" class="gallery-img"></div>
    </div>
</div>

<!-- Lightbox Modal HTML -->
<div id="lightbox-modal">
    <span class="lightbox-close">&times;</span>
    <span class="lightbox-prev">&#10094;</span>
    <span class="lightbox-next">&#10095;</span>
    <img id="lightbox-img" src="" alt="">
    <div id="lightbox-caption" class="lightbox-caption"></div>
</div>

<!-- JavaScript για τη λειτουργία gallery -->
<script>
    const images = document.querySelectorAll('.gallery-img');
    const modal = document.getElementById('lightbox-modal');
    const modalImg = document.getElementById('lightbox-img');
    const captionText = document.getElementById('lightbox-caption');
    const closeBtn = document.querySelector('.lightbox-close');
    const prevBtn = document.querySelector('.lightbox-prev');
    const nextBtn = document.querySelector('.lightbox-next');

    let currentIndex = 0;
    const imageArray = Array.from(images);

    function showImage(index) {
        if (index < 0) {
            currentIndex = imageArray.length - 1;
        } else if (index >= imageArray.length) {
            currentIndex = 0;
        } else {
            currentIndex = index;
        }
        modalImg.src = imageArray[currentIndex].src;
        captionText.innerHTML = imageArray[currentIndex].alt;
    }

    imageArray.forEach((img, index) => {
        img.addEventListener('click', () => {
            modal.style.display = 'flex';
            showImage(index);
        });
    });

    closeBtn.addEventListener('click', () => {
        modal.style.display = 'none';
    });

    modal.addEventListener('click', (e) => {
        if (e.target === modal) {
            modal.style.display = 'none';
        }
    });

    prevBtn.addEventListener('click', () => {
        showImage(currentIndex - 1);
    });

    nextBtn.addEventListener('click', () => {
        showImage(currentIndex + 1);
    });

    document.addEventListener('keydown', (e) => {
        if (modal.style.display === 'flex') {
            if (e.key === 'ArrowLeft') showImage(currentIndex - 1);
            if (e.key === 'ArrowRight') showImage(currentIndex + 1);
            if (e.key === 'Escape') modal.style.display = 'none';
        }
    });
</script>

</body>
</html>
